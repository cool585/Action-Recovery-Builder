name: OrangeFox Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: OrangeFox Manifest Branch
        options:
        - "12.1"
        - "11.0"
        required: true
        default: "12.1"
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
        default: https://github.com/DhineshCool/twrp_device_motorola_liber
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
        default: fox_12.1
      DEVICE_PATH:
        description: Device Tree Path (relative to source root)
        required: true
        default: device/motorola/liber
      DEVICE_NAME:
        description: Device Codename
        required: true
        default: liber
      BUILD_TARGET:
        type: choice
        description: Partition containing recovery ramdisk
        options:
        - recovery
        - boot
        - vendor_boot
        required: true
        default: recovery

jobs:
  build:
    if: github.actor == 'DhineshCool' || github.repository_owner == 'cool585' || github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest Branch: fox_${{ inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            build-essential libgtk-3-dev libglu1-mesa-dev freeglut3-dev git libxml2 lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libncurses6 python3 python-is-python3 tar
        sudo apt-get install -y libncurses5 libtinfo5 || (wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb && sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb && rm -f libtinfo5_6.3-2ubuntu0.1_amd64.deb) || true

    - name: Install repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync OrangeFox Source Tree
      run: |
        git config --global user.name "${GITHUB_ACTOR}"
        git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git ~/orangefox_sync
        cd ~/orangefox_sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path "${GITHUB_WORKSPACE}/workspace"
      shell: bash

    - name: Clone Device Tree
      run: |
        rm -rf ./${{ inputs.DEVICE_PATH }}
        git clone "${{ inputs.DEVICE_TREE_URL }}" -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
      working-directory: workspace

    - name: Building OrangeFox Recovery
      run: |
        export FOX_BUILD_DEVICE="${{ inputs.DEVICE_NAME }}"
        set +e
        source build/envsetup.sh
        set -e
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch fox_${{ inputs.DEVICE_NAME }}-eng || lunch twrp_${{ inputs.DEVICE_NAME }}-eng
        make $(tr -d _ <<< ${{ inputs.BUILD_TARGET }})image -j$(nproc --all) 2>&1 | tee build.log
        BUILD_STATUS=${PIPESTATUS[0]}
        if [ ${BUILD_STATUS} -ne 0 ]; then
          echo "Build failed with exit code ${BUILD_STATUS}"
          exit ${BUILD_STATUS}
        fi
      shell: bash
      working-directory: workspace

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: orangefox-build-failure-log
        path: |
          workspace/build.log
          workspace/out/error*.log
          workspace/out/verbose.log
          workspace/out/soong.log

    - name: Prepare Release Artifacts
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/release_assets
        find workspace/out/target/product/${{ inputs.DEVICE_NAME }}/ -maxdepth 2 -type f \( -name "OrangeFox*.img" -o -name "OrangeFox*.zip" -o -name "*.img" -o -name "*.zip" \) -exec cp -v {} ${GITHUB_WORKSPACE}/release_assets/ \; || true
        ls -la ${GITHUB_WORKSPACE}/release_assets/
      shell: bash

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_assets/*
        name: OrangeFox Recovery for ${{ inputs.DEVICE_NAME }}
        tag_name: orangefox-${{ github.run_id }}
        body: |
          OrangeFox Recovery Build for ${{ inputs.DEVICE_NAME }}
          Manifest: fox_${{ inputs.MANIFEST_BRANCH }}
          Target: ${{ inputs.BUILD_TARGET }}.img
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
